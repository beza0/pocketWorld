# Store builds on Expo Application Services. Requires the EXPO_TOKEN repository secret
# (expo.dev → Account settings → Access tokens) and an initialised EAS project (`eas init`).
name: EAS build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: ios, android or all
        default: all
        required: true
      submit:
        description: Submit to App Store Connect / Google Play after building
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - run: npm run content:validate
      - run: eas build --platform ${{ inputs.platform }} --profile production --non-interactive ${{ inputs.submit && '--auto-submit' || '' }}
